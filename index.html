<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8">
<title>Mis Enlaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E3E8EF; --ink:#141B26; --muted:#5B6678; --line:#D5DCE6;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --ok:#0F7A4B; --danger:#B42318;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E131B; --surface:#161D28; --sunk:#1E2734; --ink:#E8EDF5; --muted:#97A3B6; --line:#2A3443;
  --accent:#7FA2FF; --accent-ink:#0B1222; --ok:#4ACB8E; --danger:#FF8A7A; color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-inline:16px;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;line-height:1;margin:0}
h1 span{color:var(--accent)}
.hdr-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}

.add{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.add label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.add label i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400}
.field{display:grid;gap:4px;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
#url{font-family:var(--f-mono);font-size:14px}
input::placeholder{color:var(--muted);opacity:.8}
.add-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);min-width:0}
.hint.err{color:var(--danger)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:9px 16px}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px;flex:none}
.btn.done{color:var(--ok);border-color:var(--ok)}

.search{position:relative}
.search input{padding-left:36px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
@media (max-width:560px){.card{grid-template-columns:1fr}}
.live{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:10px}
@media (max-width:420px){.live{grid-template-columns:1fr}}

.thumb{aspect-ratio:1.91/1;width:100%;border-radius:8px;position:relative;overflow:hidden;display:block;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,hsl(var(--h) 70% 52%),hsl(calc(var(--h) + 40) 75% 38%))}
.thumb img.og{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:var(--sunk)}
.thumb .mono{position:absolute;left:12px;bottom:6px;font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.live .thumb .mono{font-size:30px;left:8px;bottom:4px}
.thumb .kind{position:absolute;right:8px;top:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.45);color:#fff;padding:3px 7px;border-radius:99px;z-index:2}
.thumb.loading::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.thumb.loading::before{animation:none}}

.meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.domain{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0}
.domain img{width:16px;height:16px;border-radius:3px;flex:none}
.domain b{font-weight:500;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex{font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--muted)}
.title{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.live .title{font-size:16px}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.desc{color:var(--muted);font-size:14px;margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:14px;margin:0;overflow-wrap:anywhere;border-left:2px solid var(--line);padding-left:8px}
.date{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.share{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.share-row{display:flex;flex-wrap:wrap;gap:6px}
.share .msg{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.confirm{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-size:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-display);color:var(--ink);font-size:18px;margin-bottom:4px}
.section-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mis <span>Enlaces</span></h1>
    <div class="hdr-r">
      <span class="count" id="count">0 enlaces</span>
      <button class="btn small" id="export" title="Descarga una copia de tus enlaces">Exportar</button>
      <label class="btn small" for="import" title="Recupera enlaces desde una copia">Importar</label>
      <input type="file" id="import" accept="application/json,.json" hidden>
    </div>
  </header>

  <form class="add" id="form" autocomplete="off">
    <div class="field">
      <label for="url">Enlace</label>
      <input id="url" type="text" inputmode="url" placeholder="Pega aquí un enlace" required>
    </div>
    <div class="live" id="live" hidden></div>
    <div class="row">
      <div class="field">
        <label for="t">Título <i>(opcional)</i></label>
        <input id="t" type="text" placeholder="Se toma de la página">
      </div>
      <div class="field">
        <label for="n">Nota <i>(opcional)</i></label>
        <input id="n" type="text" placeholder="Por qué lo guardas">
      </div>
    </div>
    <div class="add-foot">
      <span class="hint" id="hint">Pega un enlace y verás su vista previa.</span>
      <button class="btn primary" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Guardar enlace
      </button>
    </div>
  </form>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar por título, descripción, nota o dominio" aria-label="Buscar enlaces">
  </div>

  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const LS = "mis-enlaces-v2";
  let links = [];
  let openShare = null, openDel = null;
  const previewCache = new Map();

  const EXAMPLES = [
    {id:"ex1",url:"https://es.wikipedia.org/wiki/Monasterio_de_El_Escorial",note:"Ejemplo: prueba «Copiar» o «Compartir». Desaparece al guardar tu primer enlace.",createdAt:Date.now()-864e5,example:true},
    {id:"ex2",url:"https://github.com/mdn/content",note:"Ejemplo: repositorio de código.",createdAt:Date.now()-2*864e5,example:true},
  ];

  // ---------- utilidades ----------
  const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function normalize(raw){
    let s = (raw||"").trim(); if(!s) return null;
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = "https://" + s;
    try{ const u = new URL(s); return (/^https?:$/.test(u.protocol) && u.hostname.includes(".")) ? u : null }catch{ return null }
  }
  const host = u => u.hostname.replace(/^www\.|^m\./,"");
  const hue = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h%360 };
  function kindOf(u){
    const h = host(u), p = u.pathname.toLowerCase();
    if(/youtube\.com|youtu\.be|vimeo\.com|twitch\.tv|tiktok\.com/.test(h)) return "Vídeo";
    if(/github\.com|gitlab\.com|bitbucket\.org|codepen\.io|stackoverflow\.com/.test(h)) return "Código";
    if(/\.pdf$/.test(p)) return "PDF";
    if(/\.(png|jpe?g|gif|webp|svg)$/.test(p) || /instagram\.com|pinterest\./.test(h)) return "Imagen";
    if(/spotify\.com|music\.apple|soundcloud/.test(h)) return "Música";
    if(/amazon\.|ebay\.|aliexpress|etsy\.com|wallapop/.test(h)) return "Compra";
    if(/x\.com|twitter\.com|linkedin\.com|facebook\.com|threads\.net|bsky\.app|reddit\.com/.test(h)) return "Social";
    if(/wikipedia\.org|medium\.com|substack\.com/.test(h)) return "Artículo";
    return "Web";
  }
  function autoTitle(u){
    const h = host(u), parts = u.pathname.split("/").filter(Boolean);
    if(/github\.com|gitlab\.com/.test(h) && parts.length>=2) return parts[0]+"/"+parts[1];
    let last = [...parts].reverse().find(p=>!/^\d+$/.test(p) && p.length>1) || "";
    try{ last = decodeURIComponent(last) }catch{}
    last = last.replace(/\.(html?|php|aspx?)$/i,"").replace(/[-_+]+/g," ").trim();
    if(last.length>2) return last.charAt(0).toUpperCase()+last.slice(1);
    const n = h.split(".").slice(-2,-1)[0] || h; return n.charAt(0).toUpperCase()+n.slice(1);
  }
  const monogram = u => { const n = host(u).split(".").slice(-2,-1)[0] || host(u); return (n[0]||"?").toUpperCase()+(n[1]||"") };
  const fmtDate = ts => new Date(ts).toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"});
  const titleOf = l => l.title || l.preview?.title || autoTitle(new URL(l.url));
  const shareText = l => [titleOf(l), l.note, l.url].filter(Boolean).join("\n");
  const safeImg = s => (typeof s==="string" && /^https:\/\//.test(s)) ? s : "";

  // ---------- vista previa real (Microlink) ----------
  async function fetchPreview(url){
    if(previewCache.has(url)) return previewCache.get(url);
    const p = (async () => {
      try{
        const r = await fetch("https://api.microlink.io/?url=" + encodeURIComponent(url));
        const j = await r.json();
        if(j.status !== "success" || !j.data) return null;
        const d = j.data;
        return {
          title: (d.title||"").trim().slice(0,200),
          description: (d.description||"").trim().slice(0,400),
          image: safeImg(d.image?.url) || safeImg(d.screenshot?.url),
          logo: safeImg(d.logo?.url),
          publisher: (d.publisher||"").trim().slice(0,80),
        };
      }catch{ return null }
    })();
    previewCache.set(url, p);
    const res = await p; if(!res) previewCache.delete(url);
    return res;
  }

  function thumbHTML(u, pv, {href, loading}={}){
    const tag = href ? `a href="${esc(href)}" target="_blank" rel="noopener noreferrer" aria-label="Abrir ${esc(host(u))}"` : "div";
    const img = pv?.image ? `<img class="og" src="${esc(pv.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
    return `<${tag} class="thumb${loading?" loading":""}" style="--h:${hue(host(u))}">
      ${img}<span class="kind">${kindOf(u)}</span><span class="mono">${esc(monogram(u))}</span></${href?"a":"div"}>`;
  }
  const logoHTML = pv => pv?.logo ? `<img src="${esc(pv.logo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : "";

  // ---------- toast y portapapeles ----------
  let tt;
  function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1900) }
  async function copy(text, btn, label){
    let ok=false;
    try{ await navigator.clipboard.writeText(text); ok=true }catch{
      const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand("copy") }catch{} ta.remove();
    }
    if(ok){ toast(label||"Copiado"); btn?.classList.add("done"); setTimeout(()=>btn?.classList.remove("done"),1200) }
    else toast("No se pudo copiar. Selecciona el texto y cópialo a mano.");
  }

  // ---------- render ----------
  const ICON = {
    copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
    link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
    share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
    open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  };
  function shareTargets(l){
    const t = encodeURIComponent(shareText(l)), u = encodeURIComponent(l.url), ti = encodeURIComponent(titleOf(l));
    return [
      ["WhatsApp", `https://wa.me/?text=${t}`],
      ["Telegram", `https://t.me/share/url?url=${u}&text=${encodeURIComponent([titleOf(l),l.note].filter(Boolean).join(" — "))}`],
      ["X", `https://twitter.com/intent/tweet?text=${ti}&url=${u}`],
      ["LinkedIn", `https://www.linkedin.com/sharing/share-offsite/?url=${u}`],
      ["Facebook", `https://www.facebook.com/sharer/sharer.php?u=${u}`],
      ["Correo", `mailto:?subject=${ti}&body=${t}`],
    ];
  }
  function card(l){
    const u = new URL(l.url), pv = l.preview;
    return `<article class="card" data-id="${esc(l.id)}">
      ${thumbHTML(u, pv, {href:l.url, loading: !pv && !l.noPreview})}
      <div class="meta">
        <div class="domain">${logoHTML(pv)}<b>${esc(pv?.publisher || host(u))}</b>${l.example?'<span class="ex">Ejemplo</span>':""}</div>
        <h2 class="title"><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(titleOf(l))}</a></h2>
        ${pv?.description?`<p class="desc">${esc(pv.description)}</p>`:""}
        ${l.note?`<p class="note">${esc(l.note)}</p>`:""}
        <span class="date">Guardado el ${fmtDate(l.createdAt)}</span>
        <div class="actions">
          <button class="btn" data-act="copy" title="Copia título, nota y enlace">${ICON.copy}Copiar</button>
          <button class="btn" data-act="copylink" title="Copia solo la dirección">${ICON.link}Solo enlace</button>
          <button class="btn" data-act="share" aria-expanded="${openShare===l.id}">${ICON.share}Compartir</button>
          <a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${ICON.open}Abrir</a>
          ${l.example?"":`<button class="btn danger" data-act="del" aria-label="Borrar">${ICON.del}</button>`}
        </div>
      </div>
      ${openShare===l.id?`<div class="share">
        <div class="share-row">${shareTargets(l).map(([n,h])=>`<a class="btn" href="${esc(h)}" target="_blank" rel="noopener noreferrer">${n}</a>`).join("")}
          <button class="btn primary" data-act="copymsg" style="padding:7px 12px">${ICON.copy}Copiar mensaje</button></div>
        <div class="msg">${esc(shareText(l))}</div></div>`:""}
      ${openDel===l.id?`<div class="confirm">¿Borrar este enlace?
        <button class="btn danger" data-act="delyes">Sí, borrar</button><button class="btn" data-act="delno">Cancelar</button></div>`:""}
    </article>`;
  }
  const visible = () => links.length ? links : EXAMPLES;
  function render(){
    const q = $("#q").value.trim().toLowerCase(), real = links.length>0;
    const shown = visible().filter(l => !q || [titleOf(l), l.preview?.description, l.note, l.url].join(" ").toLowerCase().includes(q));
    $("#count").textContent = `${links.length} ${links.length===1?"enlace":"enlaces"}`;
    let html = "";
    if(!real) html += `<div class="empty"><strong>Aún no has guardado nada</strong>Pega un enlace arriba y pulsa «Guardar enlace». Debajo tienes dos ejemplos para probar los botones.</div><div class="section-label">Ejemplos</div>`;
    if(real && !shown.length) html += `<div class="empty"><strong>Sin resultados</strong>Ningún enlace coincide con «${esc(q)}».</div>`;
    $("#list").innerHTML = html + shown.map(card).join("");
  }

  // Completa las vistas previas que falten (una a una)
  let filling = false;
  async function fillMissing(){
    if(filling) return; filling = true;
    for(const l of visible()){
      if(l.preview || l.noPreview) continue;
      const pv = await fetchPreview(l.url);
      if(pv) l.preview = pv; else l.noPreview = true;
      if(!l.example) save(); render();
    }
    filling = false;
  }

  // ---------- vista previa en vivo ----------
  let liveTimer, liveUrl = null, livePv = null;
  function drawLive(loading){
    const u = normalize($("#url").value), box = $("#live");
    if(!u){ box.hidden = true; return }
    box.hidden = false;
    const pv = liveUrl===u.href ? livePv : null;
    const t = $("#t").value.trim() || pv?.title || autoTitle(u);
    box.innerHTML = thumbHTML(u, pv, {loading}) + `<div class="meta">
      <div class="domain">${logoHTML(pv)}<b>${esc(pv?.publisher || host(u))}</b></div>
      <div class="title">${esc(t)}</div>${pv?.description?`<p class="desc">${esc(pv.description)}</p>`:""}</div>`;
  }
  function onUrl(){
    $("#hint").classList.remove("err");
    const u = normalize($("#url").value);
    clearTimeout(liveTimer);
    if(!u){ drawLive(); $("#hint").textContent = "Pega un enlace y verás su vista previa."; return }
    if(liveUrl !== u.href){ livePv = null }
    drawLive(liveUrl !== u.href);
    $("#hint").textContent = "Cargando vista previa…";
    liveTimer = setTimeout(async () => {
      const pv = await fetchPreview(u.href);
      if(normalize($("#url").value)?.href !== u.href) return;
      liveUrl = u.href; livePv = pv; drawLive(false);
      $("#hint").textContent = pv ? "Vista previa lista. Pulsa «Guardar enlace»." : "No hay vista previa para este enlace, pero puedes guardarlo igual.";
    }, 450);
  }
  $("#url").addEventListener("input", onUrl);
  ["#t","#n"].forEach(s=>$(s).addEventListener("input",()=>drawLive(false)));

  // ---------- almacenamiento ----------
  function save(){ try{ localStorage.setItem(LS, JSON.stringify(links)) }catch{ toast("No se pudo guardar en este navegador") } }
  function load(){ try{ const v = JSON.parse(localStorage.getItem(LS)||"[]"); return Array.isArray(v)?v:[] }catch{ return [] } }
  const sortLinks = () => links.sort((a,b)=>b.createdAt-a.createdAt);
  const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  $("#form").addEventListener("submit", e => {
    e.preventDefault();
    const u = normalize($("#url").value);
    if(!u){ const h=$("#hint"); h.textContent="Eso no parece un enlace. Prueba con algo como ejemplo.com/pagina."; h.classList.add("err"); $("#url").focus(); return }
    if(links.some(l=>l.url===u.href)){ toast("Ese enlace ya está guardado"); return }
    const pv = liveUrl===u.href ? livePv : null;
    links.unshift({id:newId(), url:u.href, title:$("#t").value.trim(), note:$("#n").value.trim(), createdAt:Date.now(), ...(pv?{preview:pv}:{})});
    sortLinks(); save(); openShare = openDel = null;
    $("#form").reset(); liveUrl = livePv = null; drawLive(); $("#hint").textContent = "Pega un enlace y verás su vista previa.";
    render(); toast("Enlace guardado"); fillMissing(); $("#url").focus();
  });
  $("#q").addEventListener("input", render);

  $("#list").addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if(!b) return;
    const id = b.closest(".card").dataset.id, l = visible().find(x=>x.id===id); if(!l) return;
    const act = b.dataset.act;
    if(act==="copy") copy(shareText(l), b, "Contenido copiado");
    else if(act==="copylink") copy(l.url, b, "Enlace copiado");
    else if(act==="copymsg") copy(shareText(l), b, "Mensaje copiado, pégalo donde quieras");
    else if(act==="share"){
      // En el móvil abre el menú de compartir del sistema
      if(navigator.share && matchMedia("(pointer:coarse)").matches){
        try{ await navigator.share({title:titleOf(l), text:[titleOf(l), l.note].filter(Boolean).join("\n"), url:l.url}); return }
        catch(err){ if(err && err.name==="AbortError") return }
      }
      openShare = openShare===id?null:id; openDel=null; render();
    }
    else if(act==="del"){ openDel=id; openShare=null; render() }
    else if(act==="delno"){ openDel=null; render() }
    else if(act==="delyes"){ links = links.filter(x=>x.id!==id); openDel=null; save(); render(); toast("Enlace borrado") }
  });

  // ---------- exportar / importar ----------
  $("#export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(links,null,2)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `mis-enlaces-${new Date().toISOString().slice(0,10)}.json`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  });
  $("#import").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if(!f) return;
    try{
      const data = JSON.parse(await f.text()); if(!Array.isArray(data)) throw 0;
      const have = new Set(links.map(l=>l.url)); let n = 0;
      for(const d of data){
        const u = normalize(d?.url); if(!u || have.has(u.href)) continue;
        links.push({id:newId(), url:u.href, title:String(d.title||""), note:String(d.note||""), createdAt:Number(d.createdAt)||Date.now()}); have.add(u.href); n++;
      }
      sortLinks(); save(); render(); fillMissing();
      toast(n ? `${n} ${n===1?"enlace importado":"enlaces importados"}` : "No había enlaces nuevos en ese archivo");
    }catch{ toast("Ese archivo no es una copia de Mis Enlaces") }
  });

  // ---------- arranque ----------
  links = load(); sortLinks(); render(); fillMissing();
})();
</script>
</body>
</html>
